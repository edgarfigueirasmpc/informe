# Informes MPC: sitio estático. No hay servidor, no hay secretos que inyectar;
# lo único que se configura son los dos orígenes con los que habla el navegador.
services:
  - type: web
    name: informes-mpc
    runtime: static
    buildCommand: npm ci && npm test && npm run build:publico
    staticPublishPath: ./dist-publico
    envVars:
      - key: MPC_CLOUD_API
        value: https://cloud.mpc1.es
      - key: MPC_LOGIN_API
        value: https://datos.mpc1.es
    headers:
      - path: /*
        name: Content-Security-Policy
        # Sin orígenes comodín: el navegador solo puede hablar con Cloud y con
        # el login delegado. `worker-src blob:` lo necesita pdf.js; los estilos
        # en línea, los gráficos.
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          font-src 'self';
          connect-src 'self' https://cloud.mpc1.es https://datos.mpc1.es;
          worker-src 'self' blob:;
          object-src 'none';
          base-uri 'none';
          form-action 'self';
          frame-ancestors 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /index.html
        # El informe viaja en el fragmento del enlace: la página siempre fresca,
        # los recursos con su hash en el nombre ya los cachea Render.
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
